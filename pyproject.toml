[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "g-omnios"
version = "1.0.0"
description = "Universal AI Operating System & Cognitive Memory Platform for VS Code, Antigravity, Claude, ChatGPT, Qwen, and Python developers."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/Nitin-Mane/G-OmniOS"
Repository = "https://github.com/Nitin-Mane/G-OmniOS"
Documentation = "https://github.com/Nitin-Mane/G-OmniOS/tree/main/docs"

[project.scripts]
g-omnios = "omni_memory.cli:main"
gomnios = "omni_memory.cli:main"
omni-memory = "omni_memory.cli:main"
